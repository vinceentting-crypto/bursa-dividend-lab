name: Refresh Bursa stock directory and authorized history
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'  # Mondays; reference directory only, not price scraping
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh symbol directory and import approved historical CSV
        run: python scripts/update_data.py
      - name: Save directory and approved history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/history.json data/sync_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh directory and imported history'
            git pull --rebase
            git push
          fi
